name: Kotlin format preview

on:
  push:
    branches:
      - feature/shared-session-runtime

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply Kotlin formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Upload formatted sources
        uses: actions/upload-artifact@v7
        with:
          name: formatted-kotlin-sources
          path: |
            app/src/main/java/fr/jarodkohler/antiscroll/restriction/
            app/src/test/java/fr/jarodkohler/antiscroll/restriction/
            app/src/androidTest/java/fr/jarodkohler/antiscroll/
            domain/src/main/kotlin/fr/jarodkohler/antiscroll/domain/restriction/
