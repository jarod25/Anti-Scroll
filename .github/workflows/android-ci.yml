name: Android CI

on:
  push: {}
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Format, build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run verification tasks
        shell: bash
        run: |
          mkdir -p build/ci
          set -o pipefail
          ./gradlew --no-daemon --stacktrace spotlessCheck test lint assembleDebug assembleDebugAndroidTest 2>&1 | tee build/ci/verification.log

      - name: Verify Room schema snapshots
        shell: bash
        run: |
          changes="$(git status --porcelain -- data/schemas)"
          if [[ -n "$changes" ]]; then
            echo "Room schema snapshots are not synchronized with the database definition:"
            echo "$changes"
            exit 1
          fi

      - name: Capture formatter patch on failure
        if: failure()
        shell: bash
        run: |
          ./gradlew --no-daemon spotlessApply || true
          git diff --binary > build/ci/spotless.patch

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-verification-reports
          if-no-files-found: ignore
          path: |
            build/ci/verification.log
            build/ci/spotless.patch
            **/build/reports/
            **/build/test-results/
            data/schemas/
